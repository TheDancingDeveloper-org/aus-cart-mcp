# CI: lint, test (with coverage) and build the image; optionally deploy.
#
# Runs on the organisation's self-hosted runners (org policy). Toolchain steps run
# through .github/scripts/in-container.sh, because the runners drive the host's
# Docker daemon, so `container:` jobs don't work there.
#
# Deploy is optional and fully parameterised. It runs only when the repo
# variable DEPLOY_ENABLED is 'true', and takes everything environment-specific
# from variables and secrets:
#   vars:    DEPLOY_SCRIPT_URL, DEPLOY_STACK_NAME, DEPLOY_STACK_DIR
#   secrets: DEPLOY_GIT_TOKEN, DEPLOY_GIT_ACCOUNT, DEPLOY_API_KEY, DEPLOY_API_SECRET
# The script receives IMAGE_NAME and IMAGE_TAG and pins the new image in the
# target environment.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/thedancingdeveloper-org/aus-cartwatch

jobs:
  test:
    runs-on: [self-hosted, docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: lint, test and coverage
        run: |
          bash .github/scripts/in-container.sh ghcr.io/astral-sh/uv:python3.14-bookworm-slim . '
            uv sync --locked
            uv run ruff format --check .
            uv run ruff check .
            uv run pytest --cov --cov-report=term
          '

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: [self-hosted, docker, publish]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=LicenseRef-Proprietary

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [image]
    runs-on: [self-hosted, docker, publish]
    concurrency:
      group: deploy-${{ vars.DEPLOY_STACK_NAME }}
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ github.sha }}
      STACK_NAME: ${{ vars.DEPLOY_STACK_NAME }}
      STACK_DIR: ${{ vars.DEPLOY_STACK_DIR }}
      GIT_AUTH_TOKEN: ${{ secrets.DEPLOY_GIT_TOKEN }}
      KOMODO_GIT_ACCOUNT: ${{ secrets.DEPLOY_GIT_ACCOUNT }}
      KOMODO_API_KEY: ${{ secrets.DEPLOY_API_KEY }}
      KOMODO_API_SECRET: ${{ secrets.DEPLOY_API_SECRET }}
      DEPLOY_SCRIPT_URL: ${{ vars.DEPLOY_SCRIPT_URL }}
    steps:
      - name: pin the image and deploy
        run: |
          set -euo pipefail
          : "${DEPLOY_SCRIPT_URL:?set the DEPLOY_SCRIPT_URL repo variable}"
          curl -sSf -H "Authorization: token $GIT_AUTH_TOKEN" -o "$RUNNER_TEMP/deploy.sh" "$DEPLOY_SCRIPT_URL"
          bash "$RUNNER_TEMP/deploy.sh"
