[project]
name = "aus-cartwatch"
version = "0.1.0"
description = "Grocery price tracker for one household: watches Woolworths prices through aus-cart-mcp, alerts on sales, fills the cart."
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
dependencies = [
    "mcp==2.2.0",
    "httpx>=0.28",
    "uvicorn>=0.32",
    "starlette>=0.40",
    "jinja2>=3.1",
    "tzdata>=2024.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
    # The real aus-cart-mcp server and its mock Woolworths, for the e2e layer. Pinned to a commit:
    # an archive URL, not git+, so CI containers need no git binary.
    "aus-cart-mcp @ https://github.com/TheDancingDeveloper-org/aus-cart-mcp/archive/d9f60f48570e599afdb8ddc93638996262fc6278.tar.gz",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aus_cartwatch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["aus_cartwatch"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
