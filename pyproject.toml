[project]
name = "aus-cart-mcp"
version = "0.2.0"
description = "MCP server: search Australian retailers and manage your own online cart (Woolworths first). Multi-tenant and metered."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "mcp==2.3.0",
    "httpx>=0.28",
    "cryptography>=44",
    "uvicorn>=0.32",
    "starlette>=0.40",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aus_cart_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["aus_cart_mcp"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
