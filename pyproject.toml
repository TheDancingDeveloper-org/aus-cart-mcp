[project]
name = "aus-cart-mcp"
version = "0.3.0"
description = "MCP server: search Australian retailers and manage your own online cart (Woolworths first). Multi-tenant and metered."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "mcp==2.2.0",
    "httpx>=0.28",
    "cryptography>=44",
    "uvicorn>=0.32",
    "starlette>=0.40",
]

[project.optional-dependencies]
# The watch layer's own dependencies land with the subtree. The extra exists now
# so installs and CI can select the layer before it has any.
watch = []
# The cartwatch pages: templates, form uploads, and the receipt/Telegram extras.
ui = ["jinja2>=3.1", "python-multipart>=0.0.9"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aus_cart_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["aus_cart_mcp"]
omit = [
    "*/__main__.py",
    # The subtree's own modules and tests are not the product path yet: their
    # suite still imports the old client surface and is not collected by the
    # root testpaths. Count only the in-process watch layer (register, ledger).
    "*/aus_cart_mcp/watch/alerts/*",
    "*/aus_cart_mcp/watch/tests/*",
    "*/aus_cart_mcp/watch/web/*",
    "*/aus_cart_mcp/watch/analytics.py",
    "*/aus_cart_mcp/watch/auscart.py",
    "*/aus_cart_mcp/watch/budget.py",
    "*/aus_cart_mcp/watch/cart.py",
    "*/aus_cart_mcp/watch/client.py",
    "*/aus_cart_mcp/watch/config.py",
    "*/aus_cart_mcp/watch/detect.py",
    "*/aus_cart_mcp/watch/policy.py",
    "*/aus_cart_mcp/watch/receipts.py",
    "*/aus_cart_mcp/watch/scheduler.py",
    "*/aus_cart_mcp/watch/server.py",
    "*/aus_cart_mcp/watch/service.py",
    "*/aus_cart_mcp/watch/store.py",
    "*/aus_cart_mcp/watch/tenant_schema.py",
    "*/aus_cart_mcp/watch/tracking.py",
    "*/aus_cart_mcp/watch/types.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
