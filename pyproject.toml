[project]
name = "aus-cart-mcp"
version = "0.3.0"
description = "MCP server: search Australian retailers and manage your own online cart (Woolworths first). Multi-tenant and metered."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "mcp==2.2.0",
    "httpx>=0.28",
    "cryptography>=44",
    "uvicorn>=0.32",
    "starlette>=0.40",
]

[project.optional-dependencies]
# Watch sub-flags. `telegram` sends alerts; `receipts` OCRs a photo. Both stay
# off unless AUS_CART_MCP_FEATURES names them. The HTTP client is already a core dep.
watch = [
    "httpx>=0.28",  # already a core dep; kept so the extra is never empty
    "python-telegram-bot>=21",  # the `telegram` sub-flag
    "pytesseract>=0.3",  # the `receipts` sub-flag (needs the tesseract binary at runtime)
]
# The cartwatch pages: templates and form uploads. Receipt OCR and Telegram
# are the watch extra; ui turns the pages on.
ui = ["jinja2>=3.1", "python-multipart>=0.0.9"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aus_cart_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["aus_cart_mcp"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
