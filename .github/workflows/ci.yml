# CI: lint, test (with coverage) and build the image; optionally deploy.
#
# Runs on the organisation's self-hosted runners (org policy). Toolchain steps run
# through .github/scripts/in-container.sh, because the runners drive the host's
# Docker daemon, so `container:` jobs don't work there.
#
# Deploy: after the image is pushed, the `deploy` job pins its digest in
# indexarr/ops apps/prod-myaiagent with the apps-bump image (a PR; Argo CD
# deploys after merge). Off by default: it runs only when the repo variable
# DEPLOY_ENABLED is 'true' (kept off during the prod-myaiagent 7-day rollback
# window, to 2026-12-03) and needs the secret OPS_BUMP_TOKEN.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/thedancingdeveloper-org/aus-cart-mcp

jobs:
  test:
    runs-on: [self-hosted, docker]
    strategy:
      fail-fast: false
      matrix:
        extra: ["", "watch", "watch,ui"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: lint, test and coverage
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          bash .github/scripts/in-container.sh ghcr.io/astral-sh/uv:python3.14-bookworm-slim . '
            extras=""
            [ -n "$EXTRA" ] && extras="--extra ${EXTRA//,/ --extra }"
            uv sync --locked $extras
            uv run ruff format --check .
            uv run ruff check .
            uv run pytest --cov --cov-report=term
          '

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: [self-hosted, docker, publish]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [image]
    runs-on: [self-hosted, docker, publish]
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-prod-myaiagent-aus-cart-mcp
      cancel-in-progress: false
    env:
      OPS_BUMP_TOKEN: ${{ secrets.OPS_BUMP_TOKEN }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
      # apps-bump verifies the digest in the private ghcr package: read it with this
      # run's own token. The ops forge uses OPS_BUMP_TOKEN.
      REGISTRY_HOST: ghcr.io
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: pin the image digest in ops (apps-bump)
        run: |
          set -euo pipefail
          : "${OPS_BUMP_TOKEN:?set the OPS_BUMP_TOKEN secret}"
          : "${IMAGE_DIGEST:?the image job produced no digest}"
          printf '%s' "$OPS_BUMP_TOKEN" | docker login repo.indexarr.net -u ops-bump --password-stdin
          docker run --rm -e OPS_BUMP_TOKEN -e REGISTRY_HOST -e REGISTRY_USER -e REGISTRY_TOKEN \
            -e GITHUB_REPOSITORY -e GITHUB_SHA -e GITHUB_RUN_ID -e GITHUB_SERVER_URL \
            repo.indexarr.net/indexarr/apps-bump@sha256:5c7a89bc568be5dbba1bf80acc11f1d526724cf2fa03e90f71287f76d30191b0 \
            --app prod-myaiagent --image "$IMAGE_NAME" --digest "$IMAGE_DIGEST"
